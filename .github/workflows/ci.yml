name: Discovery Service CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: discovery-service/pom.xml

      - name: Start Config Server
        run: |
          docker run -d \
            --name config-server \
            -p 8089:8089 \
            ghcr.io/azazkhan07/config-server:latest

          for i in {1..30}; do
            if curl -fsS http://localhost:8089/actuator/health; then
              echo "Config Server is ready"
              exit 0
            fi
            sleep 5
          done

          docker logs config-server
          exit 1

      - name: Build and test
        working-directory: discovery-service
        run: chmod +x mvnw && ./mvnw --batch-mode clean verify

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./discovery-service
          file: ./discovery-service/Dockerfile
          push: true
          tags: |
            ghcr.io/azazkhan07/discovery-service:latest
            ghcr.io/azazkhan07/discovery-service:${{ github.sha }}
