spring:
  application:
    name: discovery-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8089/}"
info:
  app:
    name: "Discovery Service"
    description: "Eureka Service Registry"
    version: "1.0"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost

  client:
    register-with-eureka: false
    fetch-registry: false